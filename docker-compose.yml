services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/health"]
      interval: 90s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      PG_DSN: "postgresql://rag:ragpass@postgres:5432/rag"
      INDEX_NAME: "docs"
      EMBED_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
    depends_on:
      - qdrant
      - postgres
    ports:
      - "8000:8000"

  ingest:
    build:
      context: ./services/ingest
    restart: "no"   # runs one time if triggered manually
    env_file: .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      PG_DSN: "postgresql://rag:ragpass@postgres:5432/rag"
      INDEX_NAME: "docs"
      EMBED_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
    depends_on:
      - qdrant
    entrypoint: ["python", "ingest.py"]

  ui:
    build:
      context: ./ui
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE: "http://api:8000"
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  qdrant_data:
  pgdata:
