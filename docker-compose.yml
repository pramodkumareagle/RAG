version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_INDEX_NAME: "docs"
      EMBED_MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
      INDEX_NAME: "docs"
      EMBED_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
    depends_on:
      - qdrant
      - postgres
    ports:
      - "8000:8000"


  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    env_file: .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      INDEX_NAME: "docs"
      EMBED_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      DATA_DIR: "/workspace/data"
    volumes:
      - ./data:/workspace/data:ro
    depends_on:
      - qdrant
    entrypoint: ["python", "ingest.py"]


  ui:
    build:
      context: ./ui
    env_file: .env
    environment:
      API_BASE: "http://api:8000"
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  qdrant_data:
  pgdata:
